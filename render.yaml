services:
  - type: web
    name: stalk
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ping
    envVars:
      - key: SECRET_KEY
        generateValue: true          # auto-generates a strong secret on first deploy
      - key: ANTHROPIC_API_KEY
        sync: false                  # you'll paste this in the Render dashboard
      - key: ENVIRONMENT
        value: production

    # ── Persistent SQLite (optional, $1/month for 1 GB) ─────────────────────
    # Without this, user accounts reset on every redeploy.
    # Uncomment all four lines below to enable:
    # disk:
    #   name: stalk-data
    #   mountPath: /opt/render/project/src/data
    #   sizeGB: 1

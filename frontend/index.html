<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>stalk. 👀 — your market bestie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="auth-overlay" id="auth-overlay">
    <div class="auth-card">
      <div class="auth-brand">
        <img class="auth-stalky" src="/assets/stalky-full.png" alt="stalky"
             onerror="this.style.display='none'" />
        <div class="auth-brand-text">
          <span class="auth-logo">stalk<span>.</span> 👀</span>
          <span class="auth-tagline">stalk the stock · your market bestie awaits</span>
        </div>
      </div>
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">sign in</button>
        <button class="auth-tab" data-tab="signup">sign up</button>
      </div>
      <form id="login-form" class="auth-form">
        <input class="auth-input" type="email" id="login-email" placeholder="email" autocomplete="email" required />
        <input class="auth-input" type="password" id="login-password" placeholder="password" autocomplete="current-password" required />
        <button class="auth-submit" type="submit">let me in 🔓</button>
        <p class="auth-error hidden" id="login-error"></p>
      </form>
      <form id="signup-form" class="auth-form hidden">
        <input class="auth-input" type="text" id="signup-username" placeholder="pick a username" autocomplete="username" required />
        <input class="auth-input" type="email" id="signup-email" placeholder="email" autocomplete="email" required />
        <input class="auth-input" type="password" id="signup-password" placeholder="password (min 6 chars)" autocomplete="new-password" required />
        <button class="auth-submit" type="submit">create account ✨</button>
        <p class="auth-error hidden" id="signup-error"></p>
      </form>
    </div>
  </div>

  <div class="app-layout">

    <aside class="stock-browser" id="stock-browser">
      <div class="browser-header">
        <div class="brand-mini">
          <span class="brand-dot"></span>
          <span class="brand-text">stalk<span class="brand-text-muted">.</span></span>
        </div>
        <h2>The Watchlist <span class="wave">👀</span></h2>
        <div class="search-wrap">
          <input type="text" id="stock-search-input" placeholder="search a stock..." autocomplete="off" />
          <button class="search-clear" id="search-clear" aria-label="Clear search">×</button>
        </div>
        <div class="browser-meta" id="browser-meta"></div>
      </div>

      <div class="browser-filters" id="browser-filters"></div>

      <div id="stock-list-container" class="stock-list-container"></div>
    </aside>

    <main class="chat-panel">
      <header class="app-header">
        <div class="logo-wrap">
          <span class="logo"><span class="logo-wordmark">stalk<span class="logo-dot">.</span></span><span class="logo-icon">👀</span></span>
          <span class="tagline">stalk the stock — we're watching them so you don't have to</span>
        </div>
        <div class="header-meta" id="header-meta">
          <span class="live-dot"></span>
          <span>live · NSE</span>
        </div>
        <div class="user-chip" id="user-chip"></div>
      </header>

      <div class="content-scroll" id="content-scroll">
        <div id="analysis-card-container"></div>
        <div id="chat-window" class="chat-window"></div>
      </div>

      <div class="quick-chips">
        <button class="chip" data-msg="What does In-Form status actually mean?">🔥 what's in-form?</button>
        <button class="chip" data-msg="Explain the Buy Zone like I'm a beginner">🟢 dip zone tea</button>
        <button class="chip" data-msg="How is the rating calculated?">📊 the algorithm</button>
        <button class="chip" data-msg="Compare HDFCBANK and ICICIBANK">⚔️ HDFC vs ICICI</button>
        <button class="chip" data-msg="What's hot in IT right now?">💻 IT vibes</button>
      </div>

      <div class="input-bar">
        <input type="text" id="chat-input" placeholder="spill it... ask me anything 💬" autocomplete="off" />
        <button id="send-btn">
          <span>send</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
        </button>
      </div>
    </main>

    <button class="mobile-toggle" id="mobile-toggle" aria-label="Browse stocks">
      👀 <span>watchlist</span>
    </button>
    <div class="mobile-backdrop" id="mobile-backdrop"></div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <!-- ===== ONBOARDING SLIDESHOW (first-time signup only) ===== -->
  <div class="onboarding-overlay hidden" id="onboarding-overlay">
    <div class="onboarding-card" id="onboarding-card">
      <button class="ob-skip" id="ob-skip">skip →</button>
      <div class="ob-slide-area" id="ob-slides"></div>
      <div class="ob-dots" id="ob-dots"></div>
      <div class="ob-nav">
        <button class="ob-btn-prev" id="ob-prev">← back</button>
        <button class="ob-btn-next" id="ob-next">next →</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
